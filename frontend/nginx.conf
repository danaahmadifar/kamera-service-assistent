server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
